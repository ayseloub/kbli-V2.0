# Contoh: website utama (FE lama) tetap di "/", aplikasi chat KBLI di "/chat".
# Tempel blok "location /chat" ini ke server block domain yang SUDAH ADA.
#
#   domain/            -> FE lama (tidak berubah)
#   domain/chat        -> halaman chat
#   domain/chat/admin  -> dashboard admin
#   domain/chat/api/*  -> backend FastAPI (diteruskan Next.js)
#
# Tombol "Mulai Chat" / "Mulai Konsultasi" di FE lama cukup diarahkan ke:  /chat

server {
    listen 443 ssl;
    server_name domainmu.go.id;
    # ssl_certificate ... (sudah ada)

    # ---------- aplikasi chat KBLI ----------
    location /chat {
        proxy_pass http://127.0.0.1:3000;          # Next.js (npm run start)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Timpa (bukan tambah) supaya IP pengunjung tidak bisa dipalsukan -> TRUSTED_PROXY_HOPS=1
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;                   # upload dokumen & Excel
        proxy_read_timeout 120s;                    # rangkuman AI bisa butuh beberapa detik
    }

    # ---------- website utama (FE lama), biarkan seperti sekarang ----------
    location / {
        # root /var/www/fe-lama;  atau  proxy_pass http://127.0.0.1:XXXX;
    }
}
